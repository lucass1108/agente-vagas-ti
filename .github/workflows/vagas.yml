name: Agente Vagas TI
on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restaurar cache do banco
        uses: actions/cache@v4
        with:
          path: vagas.db
          key: vagas-db-${{ github.run_id }}
          restore-keys: |
            vagas-db-
      - run: python vagas_agent.py --email
      - name: Salvar cache do banco
        uses: actions/cache/save@v4
        with:
          path: vagas.db
          key: vagas-db-${{ github.run_id }}