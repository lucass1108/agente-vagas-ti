name: Agente Vagas TI

on:
  schedule:
    - cron: '0 11 * * 1-5'  # Seg-Sex 8h BRT (11h UTC)
  workflow_dispatch:  # Execução manual

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar agente de vagas
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python vagas_agent.py --email

      - name: Commit resultados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Atualizar vagas TI — $(date +'%d/%m/%Y')"
          file_pattern: "*.md vagas_history.json"
